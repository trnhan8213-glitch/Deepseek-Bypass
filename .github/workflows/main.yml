# .github/workflows/main.yml
name: Build AI Breaker (Debug with full log)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tạo mã nguồn C (chỉ C, bỏ C++ và C# để tránh lỗi phức tạp)
        run: |
          mkdir -p src
          cat > src/breaker.c << 'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <pthread.h>
          #include <unistd.h>

          void *background_task(void *arg) {
              while (1) {
                  sleep(5);
                  printf("[AI] Heartbeat\n");
              }
              return NULL;
          }

          __attribute__((constructor)) void init() {
              printf("[AI] Breaker loaded\n");
              pthread_t th;
              pthread_create(&th, NULL, background_task, NULL);
          }

          int ai_ping() {
              return 42;
          }
          EOF

      - name: Biên dịch với ghi log
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -z "$SDKROOT" ]; then
            SDKROOT="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          fi
          CC=$(xcrun --sdk iphoneos -f clang)
          echo "SDKROOT=$SDKROOT" > build.log
          echo "CC=$CC" >> build.log
          $CC -arch arm64 -dynamiclib \
              -isysroot "$SDKROOT" \
              -miphoneos-version-min=14.0 \
              -Wl,-undefined,dynamic_lookup \
              -O2 \
              -o breaker.dylib src/breaker.c 2>&1 | tee -a build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "Biên dịch thất bại. Xem build.log"
              exit 1
          fi

      - name: Kiểm tra file
        run: |
          file breaker.dylib || true
          ls -la breaker.dylib || true

      - name: Upload artifact (dylib nếu thành công)
        uses: actions/upload-artifact@v4
        with:
          name: breaker.dylib
          path: breaker.dylib
        continue-on-error: true

      - name: Upload log (luôn luôn, kể cả thất bại)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
