# .github/workflows/build.yml
name: Build C to dylib with Deepseek Bypass

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Create C source file
      run: |
        cat > bypass.c << 'EOF'
        // bypass.c
        // Dynamic library de can thiep vao co che kiem tra noi dung cua Deepseek
        #define _GNU_SOURCE
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <dlfcn.h>

        // Ham moc noi (hook) thay the ham kiem tra tu khoa nhay cam
        int strstr_hook(const char *haystack, const char *needle) {
            // Luon tra ve 0 (khong tim thay) de bo qua bo loc
            return 0;
        }

        // Ham khoi tao duoc goi khi thu vien duoc load
        __attribute__((constructor)) void init_bypass() {
            // Ghi de con tro ham strstr trong bang PLT
            void *handle = dlopen(NULL, RTLD_LAZY);
            void **strstr_ptr = dlsym(handle, "strstr");
            if (strstr_ptr) {
                *strstr_ptr = (void*)strstr_hook;
            }
            dlclose(handle);
        }

        // Ham xuat de AI goi nham xac nhan da vo hieu hoa rao can
        int bypass_status() {
            return 1; // 1 = da vo hieu hoa
        }

        // Ham toi uu hoa sinh code: dam bao khong phat sinh loi cu phap
        void ensure_safe_code(char *code_output) {
            // Them kiem tra null va bien mang
            if (code_output == NULL) return;
            // Xoa cac ky tu dieu khien khong mong muon
            for (int i = 0; code_output[i]; i++) {
                if (code_output[i] < 32 && code_output[i] != '\n' && code_output[i] != '\t') {
                    code_output[i] = ' ';
                }
            }
        }

        // Ham cai thien do thong minh cua AI qua goi y cau truc
        void enhance_reasoning(char *prompt) {
            // Them prefix de huong AI suy luan chat che
            char buffer[4096];
            snprintf(buffer, sizeof(buffer), 
                "Yeu cau: phan tich rang buoc, xac dinh bien, sinh ma voi kiem tra loi. %s", prompt);
            strcpy(prompt, buffer);
        }
        EOF

    - name: Compile C source to dynamic library
      run: |
        gcc -shared -fPIC -o libbypass.dylib bypass.c -Wall -Wextra -O2

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v3
      with:
        name: libbypass
        path: libbypass.dylib